<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统计与词云示例</title>
<link rel="stylesheet" href="{BASE_URL}/fonts/fonts.css"><style>body{max-width:1100px;margin:40px auto;padding:0 20px;font-family:'Noto Sans SC',sans-serif;background:#f3f6f8;color:#203341}section{background:white;padding:24px;margin:24px 0;border-radius:12px}#histogram{height:340px}canvas{max-width:100%;height:auto}#error{color:#a11}</style></head><body>
<h1>统计与中文词云</h1><p>示例数据 · 所有计算在浏览器完成</p><section><h2>数值分布</h2><div id="histogram"></div><p id="summary"></p></section>
<section><h2>主题词云</h2><canvas id="cloud" width="1000" height="400" aria-label="分析主题词云"></canvas><p>词语及权重由数据提供，本库不负责中文分词。</p></section><p id="error" role="status"></p>
<script src="{BASE_URL}/libs/charts/echarts/echarts.min.js"></script><script src="{BASE_URL}/libs/charts/echarts-stat/ecStat.min.js"></script><script src="{BASE_URL}/libs/charts/wordcloud2/wordcloud2.js"></script>
<script>window.__RENDER_READY__=false;(async()=>{await document.fonts.load('32px "Noto Sans SC"','数据分析趋势质量效率价值协作');await document.fonts.ready;
const samples=[1,2,2,3,3,3,4,5,6,8];const hist=ecStat.histogram(samples);window.analysisChart=echarts.init(document.getElementById('histogram'));
analysisChart.setOption({animation:false,textStyle:{fontFamily:'Noto Sans SC'},xAxis:{type:'category',data:hist.bins.map(b=>b.x0+'–'+b.x1)},yAxis:{type:'value'},series:[{type:'bar',data:hist.bins.map(b=>b.sample.length),itemStyle:{color:'#176b87'}}]});document.getElementById('summary').textContent='样本数：'+samples.length+'；均值：'+ecStat.statistics.mean(samples);
const canvas=document.getElementById('cloud');await new Promise((resolve,reject)=>{canvas.addEventListener('wordcloudstop',resolve,{once:true});canvas.addEventListener('wordcloudabort',()=>reject(new Error('词云布局中止')),{once:true});WordCloud(canvas,{list:[['数据',56],['分析',50],['趋势',42],['质量',38],['效率',35],['价值',30],['协作',26]],fontFamily:'Noto Sans SC',rotateRatio:0,color:'#176b87',backgroundColor:'#fff'});});window.__RENDER_READY__=true;
window.addEventListener('resize',()=>analysisChart.resize());})().catch(e=>{document.getElementById('error').textContent=e.message;console.error(e);});</script></body></html>
