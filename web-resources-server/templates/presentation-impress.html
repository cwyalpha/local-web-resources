<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空间叙事 · HTML 演示</title><link rel="stylesheet" href="{BASE_URL}/fonts/fonts.css">
<style>
body{margin:0;background:#132b36;color:#eef7fa;font-family:'Noto Sans SC',sans-serif}.step{width:960px;padding:50px;box-sizing:border-box;font-size:42px;line-height:1.6}.step h1{font-size:80px;line-height:1.3}.step h2{color:#79d8cc} .impress-enabled .step{opacity:.12;transition:opacity .5s}.impress-enabled .step.active{opacity:1}.hint{position:fixed;left:24px;bottom:16px;font-size:14px}.fallback{padding:20px;background:#284652}.impress-supported .fallback{display:none}.impress-not-supported .step{position:relative;width:auto;max-width:960px;margin:auto}.impress-not-supported .hint{display:none}
</style></head><body class="impress-not-supported">
<div class="fallback">当前环境未启用空间演示，以下内容按顺序阅读。</div>
<div id="impress" data-width="1200" data-height="800">
 <section class="step" data-x="0" data-y="0"><h1>从全局看问题</h1><p>空间叙事演示 · 示例模板</p></section>
 <section class="step" data-x="1300" data-y="0"><h2>观察局部</h2><p>每一页只展开一个关键发现。</p></section>
 <section class="step" data-x="1300" data-y="1100" data-rotate="90"><h2>转换视角</h2><p>用空间关系表达逻辑关系，而非堆叠动画。</p></section>
 <section class="step" data-x="650" data-y="500" data-scale="3"><h2>回到全局</h2><p>将发现连接成清晰的行动路径。</p></section>
</div><p class="hint">方向键 / 空格翻页</p>
<script src="{BASE_URL}/libs/layout/impress.js/impress.js"></script>
<script>window.__RENDER_READY__=false;document.fonts.load('42px "Noto Sans SC"','空间叙事演示').then(()=>document.fonts.ready).then(()=>{window.presentation=impress();presentation.init();window.__RENDER_READY__=true;});</script>
</body></html>
